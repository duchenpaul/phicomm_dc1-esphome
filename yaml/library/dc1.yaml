packages:
  esp01: !include esp01.yaml

substitutions:
  status_led_pin: GPIO0
  logger_uart: UART1
  key_click_max_length: 500ms

esp8266:
  #状态恢复保持
  restore_from_flash: yes

esphome:
  #----------------------------------------------------
  #指定编译临时文件存放位置
  build_path: build/$device_name

external_components:
  - source:
      type: local
      path: ../esphome/components
    components: [cat9554]

# If the local component path above is not available, replace the entry above with the following:
# external_components:
#   - source:
#       type: git
#       url: https://github.com/duchenpaul/phicomm_dc1-esphome
#       ref: master
#     components: [cat9554]
#     refresh: 1d

wifi:
  ssid: $wifi_ssid
  password: $wifi_password
  #----------需要设置静态地址的改下面的配置------------
  #  manual_ip:
  #    static_ip: 192.168.178.230
  #    gateway: 192.168.178.1
  #    subnet: 255.255.255.0
  #    dns1: 1.1.1.1
  #    dns2: 1.2.2.1
  #----------------------------------------------------
  domain: .local
  reboot_timeout: $wifi_reboot_timeout
  power_save_mode: none
  fast_connect: $wifi_fast_connect
# Issues found in STA
#   ap:
#     ssid: $device_name
#     password: $wifi_password

# captive_portal:

#---------不使用api与设备连接的话删除api配置---------
api:
  reboot_timeout: $api_reboot_timeout
#----------------------------------------------------

ota:
  - platform: esphome
    password: $ota_password

safe_mode:

#----------------------WEB后台----------------------
web_server:
  port: 80
#----------------------------------------------------

#----------------------深度睡眠----------------------
#deep_sleep:
#  run_duration: 20s
#  sleep_duration: 50s
#----------------------------------------------------

i2c:
  sda: GPIO3
  scl: GPIO12
  scan: false
  frequency: 20kHz

cat9554:
  - id: cat9554_hub
    address: 0x20
    irq_pin: GPIO4

uart:
  rx_pin: GPIO13
  baud_rate: 4800
  parity: EVEN

logger:
  level: DEBUG
  # level: info

sensor:
  - platform: cse7766
    voltage:
      name: "${device_name} voltage"
      unit_of_measurement: "V"
      icon: mdi:alpha-v-box-outline
    current:
      name: "${device_name} current"
      unit_of_measurement: "A"
      icon: mdi:alpha-a-box-outline
    power:
      name: "${device_name} power"
      unit_of_measurement: "W"
      icon: mdi:flash
  - platform: uptime
    name: "${device_name} uptime"
    unit_of_measurement: "s"
  - platform: wifi_signal
    name: "${device_name} wifi_signal"
    unit_of_measurement: "dB"

output:
  - platform: gpio
    #继电器3(内部引用，对外隐藏)
    id: relay3
    pin:
      cat9554: cat9554_hub
      # Use pin number 4
      number: 4
      mode: OUTPUT
      inverted: false
  - platform: gpio
    #继电器2(内部引用，对外隐藏)
    id: relay2
    pin:
      cat9554: cat9554_hub
      # Use pin number 5
      number: 5
      mode: OUTPUT
      inverted: false
  - platform: gpio
    #继电器1(内部引用，对外隐藏)
    id: relay1
    pin:
      cat9554: cat9554_hub
      # Use pin number 6
      number: 6
      mode: OUTPUT
      inverted: false
  - platform: gpio
    #总继电器(内部引用，对外隐藏)
    id: relay0
    pin:
      cat9554: cat9554_hub
      # Use pin number 7
      number: 7
      mode: OUTPUT
      inverted: false

binary_sensor:
  - platform: status
    #设备状态
    name: "${device_name} status"
    #是否对外隐藏（true/false）
    internal: false
  - platform: gpio
    #第一个按钮(内部引用，对外隐藏)
    name: "${device_name} key1"
    #是否对外隐藏（true/false）
    internal: true
    pin:
      cat9554: cat9554_hub
      # Use pin number 0
      number: 0
      mode: INPUT
    filters:
      - invert:
      - delayed_on: 40ms
      - delayed_off: 40ms
    on_click:
      min_length: 50ms
      max_length: $key_click_max_length
      then:
        - switch.toggle: switch1
  - platform: gpio
    #第二个按钮(内部引用，对外隐藏)
    name: "${device_name} key2"
    #是否对外隐藏（true/false）
    internal: true
    pin:
      cat9554: cat9554_hub
      # Use pin number 1
      number: 1
      mode: INPUT
    filters:
      - invert:
      - delayed_on: 40ms
      - delayed_off: 40ms
    on_click:
      min_length: 50ms
      max_length: $key_click_max_length
      then:
        - switch.toggle: switch2
  - platform: gpio
    #第三个按钮(内部引用，对外隐藏)
    name: "${device_name} key3"
    #是否对外隐藏（true/false）
    internal: true
    pin:
      cat9554: cat9554_hub
      # Use pin number 2
      number: 2
      mode: INPUT
    filters:
      - invert:
      - delayed_on: 40ms
      - delayed_off: 40ms
    on_click:
      min_length: 50ms
      max_length: $key_click_max_length
      then:
        - switch.toggle: switch3
  - platform: gpio
    #总开关(内部引用，对外隐藏)
    name: "${device_name} key0"
    #是否对外隐藏（true/false）
    id: key0
    internal: true
    pin:
      number: GPIO16
      allow_other_uses: false
      mode: INPUT_PULLDOWN_16
    filters:
      - invert:
      - delayed_on: 40ms
      - delayed_off: 40ms
    on_click:
      min_length: 50ms
      max_length: $key_click_max_length
      then:
        - switch.toggle: switch0

  #影子
  - platform: template
    name: "shadow1"
    id: shadow1
    internal: true
  - platform: template
    name: "shadow2"
    id: shadow2
    internal: true
  - platform: template
    name: "shadow3"
    id: shadow3
    internal: true

text_sensor:
  - platform: template
    #配置文件版本
    name: "${device_name} config_version"
    lambda: |-
      return {"v2019.12.02.001"};
  - platform: version
    #esphome版本
    name: "${device_name} esphome_version"
    icon: mdi:information-outline
  - platform: wifi_info
    ip_address:
      name: "${device_name} IP Address"
    ssid:
      name: "${device_name} Connected SSID"
#    bssid:
#      name: "${device_name} Connected BSSID"

switch:
  - platform: output
    #总开关(显示为一个开关)
    name: "${device_name} switch0"
    output: relay0
    id: switch0
    icon: mdi:light-switch
    on_turn_on:
      - switch.turn_on: LOGO_light
      - lambda: |-
          if (id(shadow1).state) {
            id(switch1).turn_on();
            id(shadow1).publish_state(false);
          }
          if (id(shadow2).state) {
            id(switch2).turn_on();
            id(shadow2).publish_state(false);
          }
          if (id(shadow3).state) {
            id(switch3).turn_on();
            id(shadow3).publish_state(false);
          }
    on_turn_off:
      - switch.turn_off: LOGO_light
      - lambda: |-
          if (id(switch1).state) {
            id(switch1).turn_off();
            id(shadow1).publish_state(true);
          }
          if (id(switch2).state) {
            id(switch2).turn_off();
            id(shadow2).publish_state(true);
          }
          if (id(switch3).state) {
            id(switch3).turn_off();
            id(shadow3).publish_state(true);
          }
      # Stay on
      # - delay: 2s
      # - switch.turn_on: switch0
  - platform: output
    #开关1(显示为一个开关)
    name: "${device_name} switch1"
    output: relay1
    id: switch1
    icon: mdi:power-socket-au
    on_turn_on:
      - lambda: |-
          if (!id(switch0).state) {
            id(switch0).turn_on();
          }
  - platform: output
    #开关2(显示为一个开关)
    name: "${device_name} switch2"
    output: relay2
    id: switch2
    icon: mdi:power-socket-au
    on_turn_on:
      - lambda: |-
          if (!id(switch0).state) {
            id(switch0).turn_on();
          }
  - platform: output
    #开关3(显示为一个开关)
    name: "${device_name} switch3"
    output: relay3
    id: switch3
    icon: mdi:power-socket-au
    on_turn_on:
      - lambda: |-
          if (!id(switch0).state) {
            id(switch0).turn_on();
          }
  - platform: gpio
    pin: GPIO14
    #LOGO灯
    name: "${device_name} LOGO_light"
    id: LOGO_light
    internal: false
    inverted: true
    icon: mdi:lightbulb
